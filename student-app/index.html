<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Canteens</title>
<link rel=stylesheet href=shared.css>
<script src=config.js></script></head>
<body><header><span>UniHub Food</span><button id=th aria-label="Switch light or dark mode">🌓</button></header><main id=m></main><footer class=mu style="text-align:center;padding:18px"><a href=privacy.html>Privacy</a> · <a href=terms.html>Terms</a> · <a href=refund.html>Refund policy</a></footer><div id=md></div>
<script>
const $=s=>document.querySelector(s),R=document.documentElement;
let AG=false,focusScroll=false,focusId=null,PK='',D=[],C=[],O=[],cart={},cid=null,view='home',F={v:'all',c:'all'};
const uid=new URLSearchParams(location.search).get('uid')||localStorage.uid||(localStorage.uid=crypto.randomUUID());
R.dataset.t=localStorage.t||'dark';document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.getAttribute('role')=='button')e.target.click()});
$('#th').onclick=()=>R.dataset.t=localStorage.t=R.dataset.t=='dark'?'light':'dark';
const cn=id=>(C.find(c=>c.id==id)||{}).name;
async function load(){const[a,b]=await Promise.all([api('/canteens'),api('/dishes')]);C=a;D=b}
async function loadO(){O=await api('/orders?student='+encodeURIComponent(uid))}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]}
function score(n,q){n=n.toLowerCase();q=q.toLowerCase().trim();if(!q)return 9;if(n.startsWith(q))return 1;const w=n.split(/[\s\/()]+/);if(w.some(x=>x.startsWith(q)))return 2;if(n.includes(q))return 3;return w.some(x=>lev(x.slice(0,q.length+1),q)<=(q.length>4?2:1))?4:9}
const tm=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const pu=o=>o.pickup_at||new Date(new Date(o.created_at).getTime()+Math.max(...o.items.map(i=>i.est))*6e4).toISOString();
function nav(v){view=v;render()}
function rr(){const y=scrollY;render();scrollTo(0,y)}
function bar(){const L=Object.entries(cart).map(([id,q])=>({d:D.find(d=>d.id==id),q})).filter(x=>x.d);if(!L.length||view=='cart')return'';const T=L.reduce((a,x)=>a+x.d.price*x.q,0),n=L.reduce((a,x)=>a+x.q,0),mx=Math.max(...L.map(x=>x.d.est_min));return`<div class=bar><span><b>${n} item${n>1?'s':''} · ₹${T}</b><br><span class=mu>Ready in about ${mx} min · pick your pickup time in the cart</span></span><button class=p onclick="nav('cart')">View cart</button></div>`}
function render(){const n=Object.values(cart).reduce((a,b)=>a+b,0),L={home:'Canteens',cart:'Cart ('+n+')',orders:'My orders'};
$('#m').innerHTML=`<div class=tabs>${Object.keys(L).map(x=>`<button class="${view==x||(view=='canteen'&&x=='home')?'on':''}" onclick="nav('${x}')">${L[x]}</button>`).join('')}</div><div id=v></div>${bar()}`;
({home:vHome,canteen:vCanteen,cart:vCart,orders:vOrders})[view]()}
function vHome(){$('#v').innerHTML=`<input id=q aria-label="Search dishes" placeholder="🔍 Search your fav dish…" autocomplete=off><div id=sg></div><div id=rs></div><h3>Canteens</h3><div class=grid>${C.map(c=>`<div class=card tabindex=0 role=button style=cursor:pointer onclick="openC('${c.id}')"><b>${c.name}</b><div class=mu>${D.filter(d=>d.canteen_id==c.id).length} dishes</div></div>`).join('')}</div>`;$('#q').oninput=e=>search(e.target.value)}
function search(q){const r=D.map(d=>[score(d.name,q),d]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name)).map(x=>x[1]);
const names=[...new Set(r.map(d=>d.name))].slice(0,6);
$('#sg').innerHTML=q&&names.length?`<div class=card style=padding:6px>${names.map(n=>`<div tabindex=0 role=button style=padding:8px;cursor:pointer onclick="pick(this.textContent)">${n}</div>`).join('')}</div>`:'';
$('#rs').innerHTML=q?(r.length?`<div class=grid>${r.slice(0,40).map(d=>`<div class=card tabindex=0 role=button style=cursor:pointer onclick="openC('${d.canteen_id}','${d.id}')"><span class="dot ${d.veg?'v':'n'}"></span><span class=sr>${d.veg?'Veg':'Non-veg'}</span><b>${d.name}</b><div class=mu>${cn(d.canteen_id)}${d.qty===0?' · Sold out':''}</div><div class=row><b>₹${d.price}</b><span class=mu>~${d.est_min} min</span></div></div>`).join('')}</div>`:'<p class=mu>No match found.</p>'):''}
function pick(n){$('#q').value=n;search(n);$('#sg').innerHTML=''}
function openC(id,dd){if(cid&&cid!=id&&Object.keys(cart).length&&!confirm('Your cart has items from another canteen. Clear it?'))return;if(cid!=id)cart={};cid=id;focusId=dd||null;focusScroll=!!dd;F={v:'all',c:'all'};nav('canteen');scrollTo(0,0)}
function vCanteen(){const L=D.filter(d=>d.canteen_id==cid),cats=[...new Set(L.map(d=>d.category))],
S=L.filter(d=>(F.v=='all'||(F.v=='v')==d.veg)&&(F.c=='all'||d.category==F.c)),
ch=(k,v,l)=>`<button class="chip ${F[k]==v?'p':''}" onclick="F.${k}='${v}';rr()">${l}</button>`;
$('#v').innerHTML=`<h3>${cn(cid)}</h3>${ch('v','all','All')+ch('v','v','Veg')+ch('v','n','Non-veg')+'<br>'+ch('c','all','Everything')+cats.map(c=>ch('c',c,c)).join('')}`+S.map(d=>{const q=cart[d.id]||0;return`<div id="dish-${d.id}" class="card row${d.id==focusId?' hl':''}"><div><span class="dot ${d.veg?'v':'n'}"></span><span class=sr>${d.veg?'Veg':'Non-veg'}</span><b>${d.name}</b><div class=mu>₹${d.price} · ~${d.est_min} min${d.qty>0?' · '+d.qty+' left':''}</div></div>${d.qty===0?'<span class=mu>Sold out</span>':q?`<div class=row><button onclick="add('${d.id}',-1)" aria-label="Remove one">−</button><b>${q}</b><button onclick="add('${d.id}',1)" aria-label="Add one">+</button></div>`:`<button class=p onclick="add('${d.id}',1)">Add</button>`}</div>`}).join('');if(focusScroll){focusScroll=false;const el=document.getElementById('dish-'+focusId);if(el){const fid=focusId;setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),60);setTimeout(()=>{const x=document.getElementById('dish-'+fid);if(x)x.classList.remove('hl');if(focusId==fid)focusId=null},5000)}}}
function add(id,x){const d=D.find(d=>d.id==id),q=(cart[id]||0)+x;if(q<=0)delete cart[id];else if(d.qty!=null&&q>d.qty)return;else cart[id]=q;rr()}
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),c5=t=>Math.ceil(t/3e5)*3e5;
const mxe=()=>Math.max(...Object.keys(cart).map(id=>(D.find(d=>d.id==id)||{est_min:0}).est_min));
function pk(L){const mx=mxe(),e=c5(Date.now()+mx*6e4),hi=Math.max(Date.now()+36e5,e+9e5),v=PK&&new Date(PK)>=Date.now()+mx*6e4?hm(new Date(PK)):hm(new Date(e));
return`<div class=card><label class=blk for=pk>Pickup time</label><input id=pk type=time step=300 value="${v}" onchange="setPK(this)"><p class=mu id=pe>Earliest ${tm(e)} (about ${mx} min). You can choose up to ${tm(hi)}. Pick a later time if you want it fresh when you arrive.</p></div><label class=chk><input type=checkbox id=ag style=width:auto ${AG?'checked':''} onchange="AG=this.checked"><span>I agree to the <a href=terms.html target=_blank>Terms</a> and <a href=refund.html target=_blank>Refund policy</a></span></label><p id=ae class=mu role=alert></p>`}
function setPK(el){const mx=mxe(),ex=Date.now()+mx*6e4,e=c5(ex),hi=Math.max(Date.now()+36e5,e+9e5),[h,m]=el.value.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);if(d.getTime()<Date.now()-18e5)d.setDate(d.getDate()+1);
let t=d.getTime(),msg='';if(t<ex-6e4){t=e;msg='That is too early, so the earliest time was set.'}if(t>hi){t=hi;msg='You can choose up to 1 hour ahead.'}
PK=new Date(t).toISOString();el.value=hm(new Date(t));$('#pe').textContent=msg||('Pickup set for '+tm(t))}
function vCart(){const L=Object.entries(cart).map(([id,q])=>({d:D.find(d=>d.id==id),q})).filter(x=>x.d),T=L.reduce((a,x)=>a+x.d.price*x.q,0);
$('#v').innerHTML=L.length?`<div class=card><b>${cn(cid)}</b>${L.map(x=>`<div class=row style=margin-top:8px><span>${x.d.name} × ${x.q}</span><span>₹${x.d.price*x.q}</span></div>`).join('')}<div class=row style=margin-top:12px><span class=mu>Estimated preparation time</span><b>~${Math.max(...L.map(x=>x.d.est_min))} min</b></div><div class=row style=margin-top:8px><b>Total</b><b>₹${T}</b></div></div>${pk(L)}<button class=p style=width:100% onclick=pay()>Pay ₹${T}</button>`:'<p class=mu>Your cart is empty.</p>'}
function modal(h){clearInterval(window.lt);$('#md').innerHTML=h?`<div class=modal><div class=card>${h}</div></div>`:''}
function pay(){if(!$('#ag').checked){$('#ae').textContent='Please accept the terms to continue';return}modal(`<h3>Payment</h3><label class=blk for=pw>Payment password</label><input id=pw type=password autocomplete=off><p id=er class=mu></p><div class=row><button onclick=modal()>Cancel</button><button class=p id=pb onclick=conf()>Pay</button></div>`)}
async function conf(){$('#pb').disabled=true;try{const data=await api('/orders',{method:'POST',body:{canteen:cid,student:uid,pass:$('#pw').value,pickup:PK||null,items:Object.entries(cart).map(([id,q])=>({id,q}))}});cart={};PK='';await load();await loadO();view='orders';render();invoice(data)}catch(e){$('#er').textContent=e.message;$('#pb').disabled=false;load().catch(()=>0)}}
function invoice(o){const mx=Math.max(...o.items.map(i=>i.est));modal(`<div class=inv data-w="${o.token}" oncontextmenu="return false"><h3>Invoice</h3><div class=tk>${o.token}</div><div class=mu>${cn(o.canteen_id)} · ${new Date(o.created_at).toLocaleString()}</div><div class=row style=margin-top:6px><span class=mu>Ordered at</span><b>${tm(o.created_at)}</b></div><div class=row><span class=mu>Collect at</span><b>${tm(pu(o))}</b></div><div class=row><span class=mu>Estimated prep time (longest item)</span><b>~${mx} min</b></div><div style=margin:10px 0>${o.items.map(i=>`<div class=row><span>${i.name} × ${i.q}</span><span>₹${i.price*i.q}</span></div>`).join('')}</div><div class=row><b>Paid</b><b>₹${o.total}</b></div><p class="mu live" id=lv></p></div><div class=row style=margin-top:12px><button onclick="modal();nav('home')">Another canteen</button><button class=p onclick=modal()>Close</button></div>`);const t=()=>{const e=$('#lv');if(e)e.textContent='LIVE '+new Date().toLocaleTimeString()+' · valid today only'};t();window.lt=setInterval(t,1000)}
function vOrders(){$('#v').innerHTML=O.map((o,i)=>{const r=o.status=='ready',e=Math.max(...o.items.map(x=>x.est));return`<div class=card><div class=row><span class=tk>${o.token}</span><span class=chip style="background:${{ready:'#15803d',collected:'#475569'}[o.status]||'#b45309'};color:#fff">${{ready:'Ready – collect now',collected:'Collected ✓'}[o.status]||'Processing'}</span></div><div class=mu>${cn(o.canteen_id)} · ₹${o.total}${o.status=='processing'?' · Collect at '+tm(pu(o)):''}</div><div>${o.items.map(x=>x.name+' × '+x.q).join(', ')}</div><button style=margin-top:8px onclick="invoice(O[${i}])">Invoice</button></div>`}).join('')||'<p class=mu>No orders yet.</p>'}
(async()=>{$('#m').innerHTML='<p class=mu style=padding:20px>Loading… the first load can take up to a minute</p>';for(let i=0;i<4;i++){try{await load();await loadO();break}catch(e){window.le=e.message;await new Promise(r=>setTimeout(r,6000))}}if(!C.length){$('#m').innerHTML='<div class=card role=alert><b>Cannot load canteens.</b><p class=mu>'+(window.le||'')+'</p><button class=p onclick=location.reload()>Retry</button></div>';return}render();setInterval(async()=>{if($('#md').innerHTML)return;try{if(view=='orders'){await loadO();rr()}else if(view=='canteen'){await load();rr()}}catch(e){}},5000)})();
</script></body></html>
