<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Canteen Owner</title>
<link rel=stylesheet href=shared.css>
<script src=config.js></script></head>
<body><header><span id=hn>UniHub Food Owner</span><span id=hb><button id=th aria-label="Switch light or dark mode">🌓</button> <button id=lo style=display:none onclick="tk='';localStorage.tk='';clearInterval(window.iv);login()">Logout</button></span></header><main id=m></main><footer class=mu style="text-align:center;padding:18px"><a href=privacy.html>Privacy</a> · <a href=terms.html>Terms</a> · <a href=refund.html>Refund policy</a></footer>
<script>
const $=s=>document.querySelector(s),R=document.documentElement,E=s=>String(s).replace(/"/g,'&quot;');
let TQ='',SQ='',me,D=[],O=[],tab='orders',F={v:'all',c:'all'};
R.dataset.t=localStorage.t||'dark';
$('#th').onclick=()=>R.dataset.t=localStorage.t=R.dataset.t=='dark'?'light':'dark';
let tk=localStorage.tk||'';const A=(p,o)=>api('/owner'+p,o,tk);
async function ld(){D=await A('/dishes')}
async function lo(){O=await A('/orders')}
async function init(){if(!tk)return login();try{me=await A('/me');await Promise.all([ld(),lo()])}catch(e){tk=localStorage.tk='';return login('Please sign in again')}
$('#hn').textContent=me.name+' · Owner';$('#lo').style.display='';render();clearInterval(window.iv);window.iv=setInterval(async()=>{try{await lo();if(tab=='orders')paintO()}catch(e){}},4000)}
let mode='in',CL=[];
async function login(m=''){$('#lo').style.display='none';if(!CL.length){try{CL=await api('/canteens')}catch(e){m=e.message}}
const up=mode=='up';$('#m').innerHTML=`<div class=card style="max-width:420px;margin:30px auto"><h1 style="font-size:22px;text-align:center"><span aria-hidden=true>🔐</span> Owner ${up?'sign up':'sign in'}</h1><p class=mu role=alert>${m}</p>
<label class=blk for=cn>Your canteen</label><select id=cn><option value="">Choose your canteen${CL.map(c=>`<option value="${c.id}">${c.name}`).join('')}</select>
<label class=blk for=e>Email</label><input id=e type=email autocomplete=email placeholder=you@example.com>
<label class=blk for=p>Password</label><input id=p type=password autocomplete="${up?'new-password':'current-password'}" placeholder="${up?'At least 8 characters':'Your password'}">
${up?`<label class=blk for=cd>Canteen access code</label><input id=cd autocomplete=off placeholder="Given to you by the admin"><label class=chk><input type=checkbox id=ag style=width:auto> I agree to the <a href=terms.html target=_blank>Terms</a> and <a href=privacy.html target=_blank>Privacy policy</a></label>`:''}
<button class=p style="width:100%;margin-top:14px" onclick=go()>${up?'Create owner account':'Sign in to dashboard'}</button>
<button style="width:100%;margin-top:8px" onclick="mode=mode=='in'?'up':'in';login()">${up?'Already have an account? Sign in':'New owner? Sign up'}</button></div>`}
async function go(){const b={canteen:$('#cn').value,email:$('#e').value.trim(),password:$('#p').value};
if(!b.canteen||!b.email||!b.password)return login('Please fill in all fields.');
if(mode=='up'){if(!$('#ag').checked)return login('Please accept the Terms and Privacy policy.');b.code=$('#cd').value.trim()}
try{const r=await api('/owner/'+(mode=='up'?'signup':'login'),{method:'POST',body:b});tk=localStorage.tk=r.token;init()}catch(e){login(e.message)}}
function render(){$('#m').innerHTML=`<div class=tabs>${[['orders','Orders'],['menu','Menu'],['hist','History']].map(t=>`<button id=t_${t[0]} class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';${t[0]=='menu'?'ld().then(render)':'render()'}">${t[1]}</button>`).join('')}</div>`+(tab=='orders'?vOrders():tab=='menu'?vMenu():vHist());if(tab=='orders')paintO()}
const tm=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const pu=o=>o.pickup_at||new Date(new Date(o.created_at).getTime()+Math.max(...o.items.map(i=>i.est))*6e4).toISOString();
function vOrders(){return`<div class=g3 id=st></div><input id=tq aria-label="Search token" placeholder="🔍 Search token (e.g. S12) to see its status" value="${E(TQ)}" oninput="TQ=this.value;paintO()" style=margin-bottom:10px><div id=ol></div>`}
function paintO(){const st=$('#st');if(!st)return;const n=s=>O.filter(o=>o.status==s).length,q=TQ.trim().toLowerCase(),rk={processing:0,ready:1,collected:2},C={processing:'#b45309',ready:'#15803d',collected:'#475569'},LB={processing:'Pending',ready:'Ready – waiting for student',collected:'Collected'};
$('#t_orders').textContent='Orders ('+n('processing')+')';
st.innerHTML=[['Pending','processing'],['Ready','ready'],['Collected','collected']].map(x=>`<div class=card style="text-align:center;margin:0"><b style="font-size:20px;font-weight:600;color:${C[x[1]]}">${n(x[1])}</b><div class=mu>${x[0]}</div></div>`).join('');
const L=[...O].filter(o=>!q||o.token.toLowerCase().includes(q)).sort((a,b)=>rk[a.status]-rk[b.status]||new Date(a.pickup_at||a.created_at)-new Date(b.pickup_at||b.created_at));
$('#ol').innerHTML=L.map(o=>`<div class=card><div class=row><span class=tk>${o.token}</span><span style="text-align:right"><b>Pickup ${tm(pu(o))}</b><br><span class=mu>₹${o.total} · ordered ${tm(o.created_at)}</span></span></div><ul style="margin:8px 0;padding-left:18px">${o.items.map(i=>`<li>${i.name} × ${i.q} <span class=mu>· start by ${tm(new Date(new Date(pu(o))-i.est*6e4))}</span></li>`).join('')}</ul><div class=row style=justify-content:flex-start;flex-wrap:wrap><span class=chip style="background:${C[o.status]||'#475569'};color:#fff;margin:0">${LB[o.status]||o.status}</span>${o.status=='processing'?`<button class=p onclick="done('${o.id}')">Done ✓</button>`:o.status=='ready'?`<button class=p onclick="got('${o.id}')">Collected ✓</button>`:''}<button onclick="printO('${o.id}')">🖨 Print invoice</button></div></div>`).join('')||`<p class=mu>${q?'No order with that token today.':'No orders yet.'}</p>`}
function printO(id){const o=O.find(x=>x.id==id),w=open('','_blank','width=380,height=640');if(!w)return alert('Please allow pop-ups to print');
const r=(a,b)=>`<div style="display:flex;justify-content:space-between"><span>${a}</span><span>${b}</span></div>`;
w.document.write(`<title>Invoice ${o.token}</title><body style="font:14px monospace;max-width:320px;margin:auto"><h2 style=text-align:center>${me.name}</h2><h1 style=text-align:center>${o.token}</h1><p>${new Date(o.created_at).toLocaleDateString()}<br>Ordered: ${tm(o.created_at)}<br>Collect at: ${tm(pu(o))}<br>Est. prep time: ~${Math.max(...o.items.map(i=>i.est))} min</p><hr>${o.items.map(i=>r(i.name+' × '+i.q,'₹'+i.price*i.q)).join('')}<hr>${r('<b>Total (paid)</b>','<b>₹'+o.total+'</b>')}<p style=text-align:center>Thank you!</p>`);w.document.close();w.focus();w.print()}
async function done(id){await A('/orders/'+id+'/done',{method:'PATCH'});await lo();paintO()}
async function got(id){await A('/orders/'+id+'/collected',{method:'PATCH'});await lo();paintO()}
function sq(v){SQ=v;render();const e=$('#sq');e.focus();e.setSelectionRange(v.length,v.length)}
const LBL=(t,h)=>`<label class=f><span>${t}</span>${h}</label>`;
function vMenu(){const cats=[...new Set(D.map(d=>d.category))],S=D.filter(d=>(F.v=='all'||(F.v=='v')==d.veg)&&(F.c=='all'||d.category==F.c)&&d.name.toLowerCase().includes(SQ.trim().toLowerCase())),
ch=(k,v,l)=>`<button class="chip ${F[k]==v?'p':''}" onclick="F.${k}='${v}';render()">${l}</button>`;
return`<input id=sq aria-label="Search dishes" placeholder="🔍 Search a dish to change its price" value="${E(SQ)}" oninput="sq(this.value)" style=margin-bottom:10px>
<div class=card><div class=ct>Apply to all dishes</div><div class=fl>${LBL('Prep time (min)','<input id=ae type=number min=1 placeholder="e.g. 20">')}${LBL('Max per day','<input id=aq type=number min=0 placeholder="e.g. 20">')}<label class=chk style="margin:0 0 9px"><input id=au type=checkbox> Unlimited</label><button class=p onclick=ap()>Apply</button></div></div>
<div class=card><div class=ct>Add a dish</div><div class=fl><label class=f style="flex:1;min-width:150px"><span>Dish name</span><input id=an placeholder="e.g. Masala Dosai" style=width:100%></label>${LBL('Price (₹)','<input id=ap type=number min=0>')}${LBL('Category','<input id=ac placeholder="Dosai">')}${LBL('Type','<select id=av><option value=1>Veg<option value=0>Non-veg</select>')}<button class=p onclick=addD()>Add dish</button></div></div>
${ch('v','all','All')}${ch('v','v','Veg')}${ch('v','n','Non-veg')}<br>${ch('c','all','Everything')}${cats.map(c=>ch('c',c,c)).join('')}`+
S.map(d=>`<div class=card><div class=row style="gap:10px"><span class="dot ${d.veg?'v':'n'}"></span><input class=nm aria-label="Dish name" value="${E(d.name)}" onchange="u('${d.id}','name',this.value)" style=flex:1><button class=ic aria-label="Delete dish" onclick="del('${d.id}')">🗑</button></div><div class=fl>${LBL('Price (₹)',`<input type=number min=0 value=${d.price} onchange="u('${d.id}','price',+this.value)">`)}${LBL('Prep time (min)',`<input type=number min=1 value=${d.est_min} onchange="u('${d.id}','est_min',+this.value)">`)}${LBL('Max per day',`<input type=number min=0 ${d.daily_qty==null?'disabled':''} value="${d.daily_qty??''}" placeholder="∞" onchange="u('${d.id}','daily_qty',+this.value).then(render)">`)}<label class=chk style="margin:0 0 9px"><input type=checkbox ${d.daily_qty==null?'checked':''} aria-label=Unlimited onchange="unl('${d.id}',this.checked)"> Unlimited</label>${LBL('Type',`<select onchange="u('${d.id}','veg',this.value=='1')"><option value=1 ${d.veg?'selected':''}>Veg<option value=0 ${d.veg?'':'selected'}>Non-veg</select>`)}${d.daily_qty==null?'':`<span class="chip ${d.qty===0?'out':'ok'}" style="margin:0 0 9px">Left today: ${d.qty}</span>`}</div></div>`).join('')}
const ist=(a=0)=>new Date(Date.now()+19800000+a*864e5).toISOString().slice(0,10);let HD=ist(-1);
const sc=(v,l,c)=>`<div class=card style="text-align:center;margin:0"><b style="font-size:20px;color:${c}">${v}</b><div class=mu>${l}</div></div>`;
function vHist(){setTimeout(hLoad,0);return`<div class=card><div class=fl>${LBL('Select date',`<input type=date id=hd value="${HD}" max="${ist()}" onchange="HD=this.value;hLoad()">`)}</div></div><div id=hs></div>`}
async function hLoad(){const e=$('#hs');if(!e||!HD)return;e.innerHTML='<p class=mu>Loading…</p>';let H;try{H=await A('/history?date='+HD)}catch(x){e.innerHTML='<p class=mu role=alert>'+x.message+'</p>';return}
const T=H.reduce((a,o)=>a+o.total,0),col=H.filter(o=>o.status=='collected').length,it={};H.forEach(o=>o.items.forEach(i=>it[i.name]=(it[i.name]||0)+i.q));
const top=Object.entries(it).sort((a,b)=>b[1]-a[1]);
e.innerHTML=`<div class=g3>${sc(H.length,'Orders','#7a8cf0')}${sc('₹'+T,'Total sales','#22a06b')}${sc(col,'Collected','#94a3b8')}</div>`+(H.length?`<div class=card><div class=ct>Items sold</div>${top.map(x=>`<div class=row style="padding:4px 0"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class=card><div class=ct>All orders</div>${H.map(o=>`<div class=row style="padding:5px 0;border-top:1px solid var(--bd)"><span><b>${o.token}</b> <span class=mu>${tm(o.created_at)}</span></span><span>₹${o.total} <span class=mu>· ${o.status=='collected'?'Collected':o.status=='ready'?'Ready':'Pending'}</span></span></div>`).join('')}</div>`:'<p class=mu>No orders on this date.</p>')}
async function u(id,f,v){await A('/dishes/'+id,{method:'PATCH',body:{[f]:v}});await ld()}
async function unl(id,on){await u(id,'daily_qty',on?null:20);render()}
async function del(id){if(!confirm('Delete dish?'))return;await A('/dishes/'+id,{method:'DELETE'});await ld();render()}
async function addD(){const n=$('#an').value.trim();if(!n)return;await A('/dishes',{method:'POST',body:{name:n,price:+$('#ap').value||0,category:$('#ac').value.trim()||'General',veg:$('#av').value=='1'}});await ld();render()}
async function ap(){const p={},e=$('#ae').value,q=$('#aq').value;if(e)p.est_min=+e;if($('#au').checked)p.daily_qty=null;else if(q!=='')p.daily_qty=+q;if(!Object.keys(p).length)return;await A('/dishes/apply',{method:'POST',body:p});await ld();render()}
init();
</script></body></html>
